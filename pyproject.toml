[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-passport"
version = "0.0.0"
description = "Verifiable, identity-rooted delegation tokens for AI agents. Built on OIDC, RFC 8693, and NIST SP 800-63-3."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anthony Spriggs" }]
keywords = ["agents", "oidc", "jwt", "delegation", "identity", "rfc8693", "nist-800-63"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "typer>=0.12",
    "structlog>=24.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
]

[project.scripts]
agent-passport = "agent_passport.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_passport"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["agent_passport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
